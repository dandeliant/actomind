<!doctype html>
<html lang="pl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ActoMind – Your Personal Acting Coach</title>
  <meta name="description" content="ActoMind – Learn your lines. Live your role. Osobisty trener pamięci i wirtualny partner sceniczny dla aktorów.">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f1e9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ActoMind">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply theme before first paint
    try {
      var s = JSON.parse(localStorage.getItem('actomind.settings') || '{}');
      var th = s.theme || 'dark';
      if (th === 'auto') th = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', th);
      document.documentElement.lang = s.lang || 'pl';
    } catch (e) {}
  </script>
</head>
<body>
  <a class="sr-only" href="#view">Przejdź do treści</a>
  <header class="app-header">
    <a class="brand" href="#/" aria-label="ActoMind – start">
      <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="bm" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e2c27f"/><stop offset="1" stop-color="#a8384a"/></linearGradient></defs>
        <circle cx="32" cy="32" r="30" fill="none" stroke="url(#bm)" stroke-width="3"/>
        <path d="M18 22c9 3 19 3 28 0v12c0 8-6 14-14 14s-14-6-14-14z" fill="url(#bm)" opacity=".92"/>
        <path d="M24.5 30h.1M39.5 30h.1" stroke="#09090b" stroke-width="4" stroke-linecap="round"/>
        <path d="M25 37c4 4 10 4 14 0" stroke="#09090b" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Acto<b>Mind</b></span>
    </a>
    <div class="header-title" id="header-title"></div>
    <div class="header-actions" id="header-actions"></div>
  </header>
  <main id="view" tabindex="-1">
    <noscript><p style="padding:2rem">ActoMind wymaga włączonej obsługi JavaScript. / ActoMind requires JavaScript.</p></noscript>
  </main>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Nawigacja"></nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
